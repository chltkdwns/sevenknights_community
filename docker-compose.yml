# Seven Knights Community — EC2 / 로컬 Docker Compose
#
# frontend + backend + MySQL 을 한 번에 기동한다.
# Redis는 현재 코드베이스에서 사용하지 않으므로 포함하지 않는다.
#
# 사용 전 루트에 .env 파일을 만들고 .env.example 값을 채운다.
#   cp .env.example .env

services:
  mysql:
    image: mysql:8.4
    container_name: sk-community-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sevenknights}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # 외부 포트는 공개하지 않는다. backend는 동일 Compose 네트워크에서 mysql:3306 으로 접속한다.
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sk-community-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Compose 내부 DNS 이름 mysql → 서비스 mysql:3306
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/sevenknights?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
      # .env 의 DB_USERNAME/DB_PASSWORD 를 MYSQL_USER/MYSQL_PASSWORD 와 동일하게 맞춘다.
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      HERO_SEED: ${HERO_SEED:-false}
      PET_SEED: ${PET_SEED:-false}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 브라우저 → 백엔드 공개 URL (Docker 내부 DNS가 아님)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: sk-community-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  backend_uploads:
