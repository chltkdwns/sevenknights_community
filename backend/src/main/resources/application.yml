server:
  port: 8080

spring:
  application:
    name: community-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sevenknights?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  cors:
    # EC2 등에서는 브라우저 origin(예: http://EC2_IP:3000)을 env로 주입한다. 로컬 기본값은 유지.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  hero:
    seed: ${HERO_SEED:false}
  pet:
    seed: ${PET_SEED:false}
