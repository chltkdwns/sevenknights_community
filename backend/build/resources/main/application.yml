server:
  port: 8080

spring:
  application:
    name: community-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sevenknights?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:_aA123456}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:SevenKnightsCommunityDevSecretKeyMustBe32CharsOrMore!!}
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:3000
  upload:
    dir: ${UPLOAD_DIR:uploads}
